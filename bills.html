<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buffalo Bills Hub | One Buffalo Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #060a12;
      --card-bg: #0c1322;
      --subcard-bg: #101a2e;
      --border-color: #1a263e;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --text-secondary: #94a3b8;
      --badge-neutral-bg: #1e293b;
      --badge-neutral-text: #94a3b8;
      --badge-good-bg: rgba(16, 185, 129, 0.16);
      --badge-good-text: #34d399;
      --badge-good-border: rgba(16, 185, 129, 0.3);
      --badge-bad-bg: rgba(239, 68, 68, 0.16);
      --badge-bad-text: #f87171;
      --badge-bad-border: rgba(239, 68, 68, 0.3);
      --accent-blue: #00338d;
      --accent-red: #c60c30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: #38bdf8;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .game-info {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .status-text {
      color: #e2e8f0;
      font-weight: 700;
    }

    .meta-separator {
      color: var(--text-muted);
    }

    .network-badge {
      background-color: #1a263e;
      color: #93c5fd;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .impact-pill {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .impact-neutral {
      background: var(--badge-neutral-bg);
      color: var(--badge-neutral-text);
    }

    .impact-good {
      background: var(--badge-good-bg);
      color: var(--badge-good-text);
      border: 1px solid var(--badge-good-border);
    }

    .impact-bad {
      background: var(--badge-bad-bg);
      color: var(--badge-bad-text);
      border: 1px solid var(--badge-bad-border);
    }

    .teams-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px 0;
    }

    .team-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .team-line.winner {
      color: #ffffff;
      font-weight: 700;
    }

    .team-score {
      font-size: 1.25rem;
      font-weight: 700;
      color: #60a5fa;
      font-variant-numeric: tabular-nums;
    }

    .team-score.winner-score {
      color: #38bdf8;
    }

    .intel-subcard {
      background-color: var(--subcard-bg);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .intel-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
    }

    .intel-desc {
      font-size: 0.8rem;
      line-height: 1.45;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-nav">
      <div class="brand-title">
        <span>Bills Command Center</span>
      </div>
      <a href="https://onebuffalotracker.fyi" class="back-link">← Dashboard</a>
    </div>

    <div class="section-header">
      <div class="section-title">Rooting Companion • Out-of-Town Scoreboard</div>
    </div>

    <div id="rooting-container" class="cards-list"></div>
  </div>

  <script>
    // Fallback data reflecting active status and post-game leverage
    const fallbackRootingData = [
      {
        awayTeam: "Tennessee Titans",
        awayScore: 26,
        homeTeam: "Indianapolis Colts",
        homeScore: 20,
        status: "FINAL",
        time: "Sun, Oct 18 • 1:00 PM ET",
        network: "FOX",
        impact: "neutral",
        preferredTeam: null,
        intelHeadline: "Neutral Matchup",
        intelDescription: "Non-conference game with zero immediate AFC tiebreaker leverage."
      },
      {
        awayTeam: "New York Jets",
        awayScore: 19,
        homeTeam: "New England Patriots",
        homeScore: 26,
        status: "FINAL",
        time: "Sun, Oct 18 • 1:00 PM ET",
        network: "CBS",
        impact: "favorable",
        preferredTeam: "New England Patriots",
        intelHeadline: null, // Dynamically computed based on final outcome
        intelDescription: "New York Jets dropped a division game, widening Buffalo's lead."
      },
      {
        awayTeam: "New Orleans Saints",
        awayScore: 34,
        homeTeam: "New York Giants",
        homeScore: 27,
        status: "FINAL",
        time: "Sun, Oct 18 • 1:00 PM ET",
        network: "FOX",
        impact: "neutral",
        preferredTeam: null,
        intelHeadline: "Neutral Matchup",
        intelDescription: "Non-conference game with zero immediate AFC tiebreaker leverage."
      },
      {
        awayTeam: "Carolina Panthers",
        awayScore: 25,
        homeTeam: "Philadelphia Eagles",
        homeScore: 14,
        status: "FINAL",
        time: "Sun, Oct 18 • 1:00 PM ET",
        network: "CBS",
        impact: "neutral",
        preferredTeam: null,
        intelHeadline: "Neutral Matchup",
        intelDescription: "Non-conference game with zero immediate AFC tiebreaker leverage."
      }
    ];

    function renderCompanionCards(games) {
      const container = document.getElementById("rooting-container");
      if (!container) return;
      container.innerHTML = "";

      games.forEach(game => {
        const isFinal = (game.status || "").toUpperCase().includes("FINAL");
        const awayScore = game.awayScore !== null && game.awayScore !== undefined ? Number(game.awayScore) : null;
        const homeScore = game.homeScore !== null && game.homeScore !== undefined ? Number(game.homeScore) : null;

        let winner = null;
        if (awayScore !== null && homeScore !== null) {
          if (awayScore > homeScore) winner = game.awayTeam;
          else if (homeScore > awayScore) winner = game.homeTeam;
        }

        // Determine Impact Badge
        let badgeClass = "impact-neutral";
        let badgeLabel = "NEUTRAL";

        if (game.impact === "favorable") {
          badgeClass = "impact-good";
          badgeLabel = "GOOD FOR BUFFALO";
        } else if (game.impact === "unfavorable") {
          badgeClass = "impact-bad";
          badgeLabel = "HURT BUFFALO";
        }

        // Resolve Intel Headline (Active vs. Final)
        let headline = game.intelHeadline;
        if (!headline) {
          if (!game.preferredTeam) {
            headline = "Neutral Matchup";
          } else if (isFinal) {
            headline = winner === game.preferredTeam
              ? `Favorable Outcome: ${game.preferredTeam} Won`
              : `Result: ${winner || 'Game'} (Preferred ${game.preferredTeam})`;
          } else {
            headline = `Root for ${game.preferredTeam}`;
          }
        }

        const card = document.createElement("div");
        card.className = "game-card";

        card.innerHTML = `
          <div class="card-meta">
            <div class="game-info">
              <span class="status-text">${game.status}</span>
              <span class="meta-separator">•</span>
              <span>${game.time}</span>
              ${game.network ? `<span class="network-badge">${game.network}</span>` : ""}
            </div>
            <div class="impact-pill ${badgeClass}">${badgeLabel}</div>
          </div>

          <div class="teams-container">
            <div class="team-line ${isFinal && winner === game.awayTeam ? 'winner' : ''}">
              <span>${game.awayTeam}</span>
              <span class="team-score ${isFinal && winner === game.awayTeam ? 'winner-score' : ''}">${awayScore ?? ''}</span>
            </div>
            <div class="team-line ${isFinal && winner === game.homeTeam ? 'winner' : ''}">
              <span>${game.homeTeam}</span>
              <span class="team-score ${isFinal && winner === game.homeTeam ? 'winner-score' : ''}">${homeScore ?? ''}</span>
            </div>
          </div>

          <div class="intel-subcard">
            <div class="intel-title">${headline}</div>
            <div class="intel-desc">${game.intelDescription || ""}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function initRootingCompanion() {
      try {
        const response = await fetch("data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();
        
        // Use rooting companion payload from scrape.js if available, else fallback
        const games = data.rootingCompanion || data.billsCompanion || fallbackRootingData;
        renderCompanionCards(games);
      } catch (err) {
        renderCompanionCards(fallbackRootingData);
      }
    }

    document.addEventListener("DOMContentLoaded", initRootingCompanion);
  </script>
</body>
</html>
