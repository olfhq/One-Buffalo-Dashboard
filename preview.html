<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>One Buffalo Tracker - Matchup Intel & Head-to-Head Preview</title>
    <style>
        :root {
            --bills-blue: #00338D;
            --bills-red: #C60C30;
            --sabres-navy: #002654;
            --sabres-gold: #FCB514;
            --bandits-orange: #F37021;
            --bandits-black: #111111;
            --bg-dark: #090d16;
            --card-bg: #141c2c;
            --card-inner: #0d1422;
            --card-border: #1f2c44;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --accent-gold: #FFB81C;
            --accent-red: #C60C30;
            --success-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
            background: linear-gradient(90deg, #38bdf8, #FCB514, #F37021);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meta-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        /* 5-TAB NAVIGATION BAR */
        .view-switcher {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .switch-btn {
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .switch-btn-active {
            background: #38bdf8;
            color: #000;
        }
        .switch-btn-inactive {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }
        .switch-btn-inactive:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Team Selector Toggle Bar */
        .preview-filter-bar {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .preview-filter-btn {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.35rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .preview-filter-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, rgba(0, 51, 141, 0.35), rgba(243, 112, 33, 0.25));
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }

        .team-badge {
            display: inline-block;
            background: rgba(255, 184, 28, 0.15);
            color: var(--accent-gold);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 184, 28, 0.3);
        }

        .matchup-teams {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }

        .team-block {
            flex: 1;
            max-width: 300px;
        }

        .team-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 0.5rem;
        }

        .vs-tag {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-muted);
            font-style: italic;
        }

        .game-meta {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        /* Section Layout */
        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid var(--accent-gold);
            padding-left: 0.75rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media(max-width: 768px) {
            .grid-2, .matchup-teams {
                grid-template-columns: 1fr;
            }
            .vs-tag {
                margin: 0.5rem 0;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }

        /* Tale of the Tape Bars */
        .tape-row {
            margin-bottom: 1.25rem;
        }

        .tape-row:last-child {
            margin-bottom: 0;
        }

        .tape-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .tape-title {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2rem;
        }

        .bar-container {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            border: 1px solid var(--card-border);
        }

        .bar-buffalo {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            border-radius: 4px 0 0 4px;
            transition: width 1s ease-in-out;
        }

        .bar-opponent {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #b91c1c);
            border-radius: 0 4px 4px 0;
            flex-grow: 1;
        }

        /* Key Matchups Cards */
        .matchup-card {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.15rem;
            margin-bottom: 1rem;
        }

        .matchup-card:last-child {
            margin-bottom: 0;
        }

        .matchup-combatants {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 0.35rem;
        }

        .matchup-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Injury Report */
        .injury-team-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.35rem;
        }

        .injury-list {
            list-style: none;
        }

        .injury-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 0.35rem 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }

        .status-out { color: var(--accent-red); font-weight: 700; }
        .status-questionable { color: var(--accent-gold); font-weight: 700; }
        .status-doubtful { color: #f97316; font-weight: 700; }
        .status-probable { color: var(--success-green); font-weight: 700; }

        /* Betting Intel */
        .betting-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .bet-card {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .bet-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .bet-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
        }

        .consensus-bar-wrapper {
            margin-top: 1rem;
        }

        .consensus-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>ONE BUFFALO INTEL</h1>
        <div class="meta-bar">
            <span id="update-status">Matchup Intel & Head-to-Head Preview</span>
            <span>•</span>
            <span>Bills • Sabres • Bandits</span>
        </div>
    </header>

    <!-- 5-TAB NAVIGATION BAR -->
    <nav class="view-switcher">
        <a href="./index.html" class="switch-btn switch-btn-inactive">
            <span>⚡</span> Command Center
        </a>
        <a href="./preview.html" class="switch-btn switch-btn-active">
            <span>⚔️</span> Matchup Intel
        </a>
        <a href="./playoffs.html" class="switch-btn switch-btn-inactive">
            <span>🏆</span> Postseason
        </a>
        <a href="./stats.html" class="switch-btn switch-btn-inactive">
            <span>📊</span> Stats Lab
        </a>
        <a href="./history.html" class="switch-btn switch-btn-inactive">
            <span>📜</span> History & Milestones
        </a>
    </nav>

    <main class="container" id="app">
        <!-- Team Selector Bar -->
        <div class="preview-filter-bar">
            <button class="preview-filter-btn active" onclick="switchPreviewTeam('bills', this)">Buffalo Bills</button>
            <button class="preview-filter-btn" onclick="switchPreviewTeam('sabres', this)">Buffalo Sabres</button>
            <button class="preview-filter-btn" onclick="switchPreviewTeam('bandits', this)">Buffalo Bandits</button>
        </div>

        <div id="preview-content">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Loading matchup intel from data.json...
            </div>
        </div>
    </main>

    <footer>
        <p>One Buffalo Multi-Sport Hub. Hosted on <a href="https://github.com" target="_blank" rel="noopener" style="color: #38bdf8;">GitHub Pages</a> via onebuffalotracker.fyi.</p>
    </footer>

    <script>
        // Built-in baseline data fallback ensuring the UI never fails to render
        const fallbackIntel = {
            bills: {
                team: "Buffalo Bills",
                nextGame: {
                    sport: "NFL",
                    opponent: "Las Vegas Raiders",
                    venue: "Allegiant Stadium — Las Vegas, NV",
                    gameTime: "Sunday, October 18, 2026 • 4:25 PM EDT",
                    taleOfTheTape: [
                        { title: "Passing Offense vs. Defense", bufLabel: "Bills 4th (278.4 YPG)", oppLabel: "Raiders 18th (215.2 YPG)", bufPct: 65 },
                        { title: "Rushing Offense vs. Defense", bufLabel: "Bills 2nd (148.5 YPG)", oppLabel: "Raiders 22nd (124.0 YPG)", bufPct: 70 },
                        { title: "Red Zone Efficiency", bufLabel: "Bills 68.4%", oppLabel: "Raiders 54.2%", bufPct: 60 },
                        { title: "Third-Down Conversion Rate", bufLabel: "Bills 46.5%", oppLabel: "Raiders 39.1%", bufPct: 55 }
                    ],
                    keyMatchups: [
                        { combatants: "Josh Allen vs. Maxx Crosby", desc: "Crosby anchors the Raiders' edge rush. Allen's escape ability under pressure dictates whether explosive chunk plays develop downfield." },
                        { combatants: "Christian Benford vs. Davante Adams", desc: "Benford draws primary coverage against Las Vegas's top target on critical 3rd-down conversions." }
                    ],
                    injuries: {
                        buffalo: [
                            { player: "Matt Milano", position: "LB", status: "Questionable" },
                            { player: "Taron Johnson", position: "CB", status: "Out" }
                        ],
                        opponent: [
                            { player: "Maxx Crosby", position: "DE", status: "Doubtful" },
                            { player: "Kolton Miller", position: "OT", status: "Questionable" }
                        ]
                    },
                    betting: {
                        spread: "BUF -4.5",
                        moneyline: "-210 / +175",
                        overUnder: "48.5",
                        buffaloConsensus: 69,
                        opponentConsensus: 31
                    }
                }
            },
            sabres: {
                team: "Buffalo Sabres",
                nextGame: {
                    sport: "NHL",
                    opponent: "Toronto Maple Leafs",
                    venue: "Scotiabank Arena — Toronto, ON",
                    gameTime: "Tonight • 7:00 PM EDT",
                    taleOfTheTape: [
                        { title: "Power Play vs. Penalty Kill", bufLabel: "Sabres 24.5%", oppLabel: "Maple Leafs 79.2%", bufPct: 58 },
                        { title: "Goals For vs. Goals Against", bufLabel: "Sabres 3.40 GF", oppLabel: "Maple Leafs 3.10 GA", bufPct: 52 },
                        { title: "Faceoff Win Percentage", bufLabel: "Sabres 51.2%", oppLabel: "Maple Leafs 48.8%", bufPct: 53 },
                        { title: "High-Danger Corsi For %", bufLabel: "Sabres 54.1%", oppLabel: "Maple Leafs 49.0%", bufPct: 56 }
                    ],
                    keyMatchups: [
                        { combatants: "Tage Thompson vs. Auston Matthews", desc: "Top line center duel. Thompson's power-play one-timer goes against Toronto's premier scoring threat." },
                        { combatants: "Ukko-Pekka Luukkonen vs. Toronto Top Line", desc: "UPL must control rebounds off early transition rushes to secure road points in Toronto." }
                    ],
                    injuries: {
                        buffalo: [
                            { player: "Zach Benson", position: "LW", status: "Questionable" }
                        ],
                        opponent: [
                            { player: "Calle Jarnkrok", position: "RW", status: "Out" },
                            { player: "Jani Hakanpaa", position: "D", status: "Questionable" }
                        ]
                    },
                    betting: {
                        spread: "BUF -1.5 (+195)",
                        moneyline: "-130 / +110",
                        overUnder: "6.5",
                        buffaloConsensus: 62,
                        opponentConsensus: 38
                    }
                }
            },
            bandits: {
                team: "Buffalo Bandits",
                nextGame: {
                    sport: "NLL",
                    opponent: "Georgia Swarm",
                    venue: "KeyBank Center — Buffalo, NY",
                    gameTime: "Sat, Nov 28 • 7:00 PM ET",
                    taleOfTheTape: [
                        { title: "Offense vs. Defense Rating", bufLabel: "Bandits 1st (12.8 GPG)", oppLabel: "Swarm 5th (11.2 GPG)", bufPct: 64 },
                        { title: "Power Play Efficiency", bufLabel: "Bandits 54.2%", oppLabel: "Swarm 48.1%", bufPct: 56 },
                        { title: "Possession & Faceoff Control", bufLabel: "Bandits 56.4%", oppLabel: "Swarm 49.8%", bufPct: 55 },
                        { title: "Goaltending Save %", bufLabel: "Bandits .801%", oppLabel: "Swarm .779%", bufPct: 58 }
                    ],
                    keyMatchups: [
                        { combatants: "Josh Byrne vs. Georgia Defense", desc: "Byrne's perimeter shooting and vision test Georgia's physical slide packages." },
                        { combatants: "Matt Vinc vs. Lyle Thompson", desc: "Vinc defends the cage against Georgia's primary playmaker." }
                    ],
                    injuries: {
                        buffalo: [
                            { player: "Dhane Smith", position: "F", status: "Probable" }
                        ],
                        opponent: [
                            { player: "Lyle Thompson", position: "F", status: "Questionable" }
                        ]
                    },
                    betting: {
                        spread: "BUF -2.5",
                        moneyline: "-180 / +150",
                        overUnder: "23.5",
                        buffaloConsensus: 74,
                        opponentConsensus: 26
                    }
                }
            }
        };

        let currentIntelData = fallbackIntel;
        let activeTeamSelection = 'bills';

        async function loadPreviewData() {
            try {
                const res = await fetch('./data.json?v=' + Date.now(), { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.bills?.nextGame && data.sabres?.nextGame) {
                        currentIntelData = data;
                    }
                }
            } catch (err) {
                console.warn('data.json fetch failed, using fallback data:', err);
            }
            renderPreview(activeTeamSelection);
        }

        function switchPreviewTeam(teamKey, btn) {
            document.querySelectorAll('.preview-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeTeamSelection = teamKey;
            renderPreview(teamKey);
        }

        function renderPreview(teamKey) {
            const teamObj = currentIntelData[teamKey];
            if (!teamObj || !teamObj.nextGame) return;
            const game = teamObj.nextGame;
            const container = document.getElementById('preview-content');

            container.innerHTML = `
                <div class="hero-banner">
                    <span class="team-badge">${game.sport || 'Pro'} Matchup Preview</span>
                    <div class="matchup-teams">
                        <div class="team-block">
                            <div class="team-name" style="color: var(--accent-gold);">${teamObj.team}</div>
                        </div>
                        <div class="vs-tag">vs</div>
                        <div class="team-block">
                            <div class="team-name">${game.opponent}</div>
                        </div>
                    </div>
                    <div class="game-meta">
                        📍 ${game.venue || 'TBD'} &nbsp;•&nbsp; 🕒 ${game.gameTime || ''}
                    </div>
                </div>

                <div class="card">
                    <h2 class="section-title">📊 Tale of the Tape: Offense vs. Defense</h2>
                    <div>
                        ${(game.taleOfTheTape || []).map(tape => `
                            <div class="tape-row">
                                <div class="tape-title">${tape.title}</div>
                                <div class="tape-labels">
                                    <span style="color: #60a5fa;">${tape.bufLabel}</span>
                                    <span style="color: #f87171;">${tape.oppLabel}</span>
                                </div>
                                <div class="bar-container">
                                    <div class="bar-buffalo" style="width: ${tape.bufPct}%;"></div>
                                    <div class="bar-opponent"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="grid-2">
                    <div class="card" style="margin-bottom: 0;">
                        <h2 class="section-title">⚔️ Key Matchups to Watch</h2>
                        <div>
                            ${(game.keyMatchups || []).map(m => `
                                <div class="matchup-card">
                                    <div class="matchup-combatants">${m.combatants}</div>
                                    <div class="matchup-desc">${m.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card" style="margin-bottom: 0;">
                        <h2 class="section-title">🏥 Injury & Inactive Report</h2>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div>
                                <div class="injury-team-title">${teamObj.team}</div>
                                <ul class="injury-list">
                                    ${((game.injuries && game.injuries.buffalo) || []).map(i => `
                                        <li class="injury-item">
                                            <span>${i.player} (${i.position})</span>
                                            <span class="status-${(i.status \vert{}\vert{} '').toLowerCase()}">${i.status}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div>
                                <div class="injury-team-title">${game.opponent}</div>
                                <ul class="injury-list">
                                    ${((game.injuries && game.injuries.opponent) || []).map(i => `
                                        <li class="injury-item">
                                            <span>${i.player} (${i.position})</span>
                                            <span class="status-${(i.status \vert{}\vert{} '').toLowerCase()}">${i.status}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h2 class="section-title">📈 Betting & Market Intel</h2>
                    <div class="betting-grid">
                        <div class="bet-card">
                            <div class="bet-label">Spread</div>
                            <div class="bet-value">${game.betting?.spread || '--'}</div>
                        </div>
                        <div class="bet-card">
                            <div class="bet-label">Moneyline</div>
                            <div class="bet-value">${game.betting?.moneyline || '--'}</div>
                        </div>
                        <div class="bet-card">
                            <div class="bet-label">Over / Under</div>
                            <div class="bet-value">${game.betting?.overUnder || '--'}</div>
                        </div>
                    </div>
                    <div class="consensus-bar-wrapper">
                        <div class="consensus-labels">
                            <span style="color: #60a5fa;">${teamObj.team} Pick (${game.betting?.buffaloConsensus || 50}%)</span>
                            <span style="color: #f87171;">${game.opponent} Pick (${game.betting?.opponentConsensus || 50}%)</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar-buffalo" style="width: ${game.betting?.buffaloConsensus || 50}%;"></div>
                            <div class="bar-opponent"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', loadPreviewData);
    </script>

</body>
</html>
