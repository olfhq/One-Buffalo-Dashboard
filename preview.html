<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Buffalo Tracker - Matchup Intel & Head-to-Head Preview</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-bills: #00338D;
            --accent-sabres: #002654;
            --accent-gold: #FFB81C;
            --accent-red: #C60C30;
            --success-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        /* Navigation Header */
        .navbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-brand span {
            color: var(--accent-gold);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, var(--bg-secondary), #090d16);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .team-badge {
            display: inline-block;
            background: rgba(255, 184, 28, 0.15);
            color: var(--accent-gold);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 184, 28, 0.3);
        }

        .matchup-teams {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }

        .team-block {
            flex: 1;
            max-width: 300px;
        }

        .team-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 0.5rem;
        }

        .vs-tag {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-muted);
            font-style: italic;
        }

        .game-meta {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        /* Section Layout */
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid var(--accent-gold);
            padding-left: 0.75rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media(max-width: 768px) {
            .grid-2, .matchup-teams {
                grid-template-columns: 1fr;
            }
            .vs-tag {
                margin: 0.5rem 0;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            backdrop-filter: blur(4px);
            margin-bottom: 2rem;
        }

        /* Tale of the Tape Bars */
        .tape-row {
            margin-bottom: 1.25rem;
        }

        .tape-row:last-child {
            margin-bottom: 0;
        }

        .tape-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .tape-title {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2rem;
        }

        .bar-container {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            border: 1px solid var(--border-color);
        }

        .bar-buffalo {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            border-radius: 4px 0 0 4px;
            transition: width 1s ease-in-out;
        }

        .bar-opponent {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #b91c1c);
            border-radius: 0 4px 4px 0;
            flex-grow: 1;
        }

        /* Key Matchups Cards */
        .matchup-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .matchup-card:last-child {
            margin-bottom: 0;
        }

        .matchup-combatants {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .matchup-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Injury Report */
        .injury-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .injury-team-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.35rem;
        }

        .injury-list {
            list-style: none;
        }

        .injury-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 0.35rem 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .status-out { color: var(--accent-red); font-weight: 700; }
        .status-questionable { color: var(--accent-gold); font-weight: 700; }
        .status-doubtful { color: #f97316; font-weight: 700; }

        /* Betting Intel */
        .betting-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .bet-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
        }

        .bet-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .bet-value {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .consensus-bar-wrapper {
            margin-top: 1rem;
        }

        .consensus-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="nav-brand">
            ONE BUFFALO <span>TRACKER</span>
        </div>
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
    </header>

    <main class="container" id="app">
        <!-- Dynamically injected preview content based on closest game timestamp -->
        <div id="preview-content">
            <!-- Loading state placeholder -->
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Calculating closest upcoming Buffalo matchup...
            </div>
        </div>
    </main>

    <script>
        // Mock Schedule & Matchup Data Engine (Auto-evaluating closest upcoming game)
        // Comparing Buffalo Bills (NFL) next game vs Buffalo Sabres (NHL) next game
        
        const nextMatchups = [
            {
                team: "Buffalo Bills",
                sport: "NFL",
                opponent: "Las Vegas Raiders",
                opponentCode: "LV",
                venue: "Allegiant Stadium — Las Vegas, NV",
                date: "Sunday, October 18, 2026 • 4:25 PM EDT",
                timestamp: new Date("2026-10-18T16:25:00-04:00").getTime(),
                taleOfTheTape: [
                    { title: "Passing Offense vs. Defense", bufLabel: "Bills 4th (278.4 YPG)", oppLabel: "Raiders 18th (215.2 YPG)", bufPct: 65 },
                    { title: "Rushing Offense vs. Defense", bufLabel: "Bills 2nd (148.5 YPG)", oppLabel: "Raiders 22nd (124.0 YPG)", bufPct: 70 },
                    { title: "Red Zone Conversion Efficiency", bufLabel: "Bills 68.4%", oppLabel: "Raiders 54.2%", bufPct: 60 },
                    { title: "Third-Down Conversion Rate", bufLabel: "Bills 46.5%", oppLabel: "Raiders 39.1%", bufPct: 55 }
                ],
                keyMatchups: [
                    { combatants: "Josh Allen vs. Maxx Crosby", desc: "Crosby anchors the Raiders' pass rush off the edge. Allen's mobility and pocket presence under heavy pressure will dictate whether explosive downfield throws open up for Keon Coleman and Khalil Shakir." },
                    { combatants: "Christian Benford vs. Davante Adams", desc: "Benford draws the primary coverage assignment against Las Vegas's premier playmaker. Neutralizing Adams on crucial 3rd-down slants is imperative to stalling the Raiders' drive rhythm." }
                ],
                injuries: {
                    buffalo: [
                        { player: "Matt Milano", position: "LB", status: "Questionable" },
                        { player: "Taron Johnson", position: "CB", status: "Out" }
                    ],
                    opponent: [
                        { player: "Star Pass Rusher", position: "DE", status: "Doubtful" },
                        { player: "Starting Tackle", position: "OT", status: "Questionable" }
                    ]
                },
                betting: {
                    spread: "BUF -4.5",
                    moneyline: "-210 / +175",
                    overUnder: "48.5",
                    buffaloConsensus: 69,
                    opponentConsensus: 31
                }
            },
            {
                team: "Buffalo Sabres",
                sport: "NHL",
                opponent: "Montreal Canadiens",
                opponentCode: "MTL",
                venue: "Centre Bell — Montreal, QC",
                date: "Saturday, October 17, 2026 • 7:00 PM EDT",
                timestamp: new Date("2026-10-17T19:00:00-04:00").getTime(),
                taleOfTheTape: [
                    { title: "Power Play vs. Penalty Kill", bufLabel: "Sabres 24.5%", oppLabel: "Canadiens 79.2%", bufPct: 58 },
                    { title: "Goals For / Game vs. Goals Against", bufLabel: "Sabres 3.40 GF", oppLabel: "Canadiens 3.10 GA", bufPct: 52 },
                    { title: "Faceoff Win Percentage", bufLabel: "Sabres 51.2%", oppLabel: "Canadiens 48.8%", bufPct: 53 },
                    { title: "High-Danger Corsi For %", bufLabel: "Sabres 54.1%", oppLabel: "Canadiens 49.0%", bufPct: 56 }
                ],
                keyMatchups: [
                    { combatants: "Tage Thompson vs. Nick Suzuki", desc: "Center ice battle featuring elite scoring touch. Thompson's lethal one-timer on the power play must be fed by Dahlin and Power against Suzuki's physical two-way checking line." },
                    { combatants: "Ukko-Pekka Luukkonen vs. Canadiens Top Line", desc: "UPL needs to anchor down early against Montreal's quick transition rush off neutral zone turnovers to secure valuable road points." }
                ],
                injuries: {
                    buffalo: [
                        { player: "Depth Forward", position: "LW", status: "Out" }
                    ],
                    opponent: [
                        { player: "Top-4 Defenceman", position: "D", status: "Questionable" }
                    ]
                },
                betting: {
                    spread: "BUF -1.5 (+195)",
                    moneyline: "-130 / +110",
                    overUnder: "6.5",
                    buffaloConsensus: 62,
                    opponentConsensus: 38
                }
            }
        ];

        function renderClosestMatchup() {
            const now = Date.now();
            // Filter future or closest upcoming game
            const upcoming = nextMatchups
                .filter(m => m.timestamp > now)
                .sort((a, b) => a.timestamp - b.timestamp);

            const activeGame = upcoming.length > 0 ? upcoming[0] : nextMatchups[0]; // Fallback to first if none strictly in future

            const container = document.getElementById('preview-content');
            
            container.innerHTML = `
                <!-- Hero Banner -->
                <div class="hero-banner">
                    <span class="team-badge">${activeGame.sport} Matchup Preview</span>
                    <div class="matchup-teams">
                        <div class="team-block">
                            <div class="team-name" style="color: var(--accent-gold);">${activeGame.team}</div>
                        </div>
                        <div class="vs-tag">@</div>
                        <div class="team-block">
                            <div class="team-name">${activeGame.opponent}</div>
                        </div>
                    </div>
                    <div class="game-meta">
                        📍 ${activeGame.venue} &nbsp;•&nbsp; 🕒 ${activeGame.date}
                    </div>
                </div>

                <!-- Tale of the Tape -->
                <div class="card">
                    <h2 class="section-title">📊 Tale of the Tape: Offense vs. Defense</h2>
                    <div>
                        ${activeGame.taleOfTheTape.map(tape => `
                            <div class="tape-row">
                                <div class="tape-title">${tape.title}</div>
                                <div class="tape-labels">
                                    <span style="color: #60a5fa;">${tape.bufLabel}</span>
                                    <span style="color: #f87171;">${tape.oppLabel}</span>
                                </div>
                                <div class="bar-container">
                                    <div class="bar-buffalo" style="width: ${tape.bufPct}%;"></div>
                                    <div class="bar-opponent"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Two Column Layout: Key Matchups & Injury Report -->
                <div class="grid-2">
                    <div class="card" style="margin-bottom: 0;">
                        <h2 class="section-title">⚔️ Key Matchups to Watch</h2>
                        <div>
                            ${activeGame.keyMatchups.map(m => `
                                <div class="matchup-card">
                                    <div class="matchup-combatants">${m.combatants}</div>
                                    <div class="matchup-desc">${m.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card" style="margin-bottom: 0;">
                        <h2 class="section-title">🏥 Injury & Inactive Report</h2>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div>
                                <div class="injury-team-title">${activeGame.team}</div>
                                <ul class="injury-list">
                                    ${activeGame.injuries.buffalo.map(i => `
                                        <li class="injury-item">
                                            <span>${i.player} (${i.position})</span>
                                            <span class="status-${i.status.toLowerCase()}">${i.status}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div>
                                <div class="injury-team-title">${activeGame.opponent}</div>
                                <ul class="injury-list">
                                    ${activeGame.injuries.opponent.map(i => `
                                        <li class="injury-item">
                                            <span>${i.player} (${i.position})</span>
                                            <span class="status-${i.status.toLowerCase()}">${i.status}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Betting & Market Intel -->
                <div class="card">
                    <h2 class="section-title">📈 Betting & Market Intel</h2>
                    <div class="betting-grid">
                        <div class="bet-card">
                            <div class="bet-label">Spread</div>
                            <div class="bet-value">${activeGame.betting.spread}</div>
                        </div>
                        <div class="bet-card">
                            <div class="bet-label">Moneyline</div>
                            <div class="bet-value">${activeGame.betting.moneyline}</div>
                        </div>
                        <div class="bet-card">
                            <div class="bet-label">Over / Under</div>
                            <div class="bet-value">${activeGame.betting.overUnder}</div>
                        </div>
                    </div>
                    <div class="consensus-bar-wrapper">
                        <div class="consensus-labels">
                            <span style="color: #60a5fa;">${activeGame.team} Public Pick (${activeGame.betting.buffaloConsensus}%)</span>
                            <span style="color: #f87171;">${activeGame.opponent} Public Pick (${activeGame.betting.opponentConsensus}%)</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar-buffalo" style="width: ${activeGame.betting.buffaloConsensus}%;"></div>
                            <div class="bar-opponent"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', renderClosestMatchup);
    </script>
</body>
</html>
