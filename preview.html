<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>One Buffalo Tracker - Matchup Intel & Head-to-Head Preview</title>
    <style>
        :root {
            --bills-blue: #00338D;
            --bills-red: #C60C30;
            --sabres-navy: #002654;
            --sabres-gold: #FCB514;
            --bandits-orange: #F37021;
            --bandits-black: #111111;
            --bg-dark: #090d16;
            --card-bg: #141c2c;
            --card-inner: #0d1422;
            --card-border: #1f2c44;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --accent-gold: #FFB81C;
            --accent-red: #C60C30;
            --success-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
            background: linear-gradient(90deg, #38bdf8, #FCB514, #F37021);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meta-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        /* 5-TAB NAVIGATION BAR */
        .view-switcher {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .switch-btn {
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .switch-btn-active {
            background: #38bdf8;
            color: #000;
        }
        .switch-btn-inactive {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }
        .switch-btn-inactive:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Team Selector Toggle Bar */
        .preview-filter-bar {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .preview-filter-btn {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.35rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .preview-filter-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, rgba(0, 51, 141, 0.35), rgba(243, 112, 33, 0.25));
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }

        .team-badge {
            display: inline-block;
            background: rgba(255, 184, 28, 0.15);
            color: var(--accent-gold);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 184, 28, 0.3);
        }

        .matchup-teams {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }

        .team-block {
            flex: 1;
            max-width: 300px;
        }

        .team-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 0.5rem;
        }

        .vs-tag {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-muted);
            font-style: italic;
        }

        .game-meta {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        /* Section Layout */
        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid var(--accent-gold);
            padding-left: 0.75rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media(max-width: 768px) {
            .grid-2, .matchup-teams {
                grid-template-columns: 1fr;
            }
            .vs-tag {
                margin: 0.5rem 0;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }

        /* Tale of the Tape Bars */
        .tape-row {
            margin-bottom: 1.25rem;
        }

        .tape-row:last-child {
            margin-bottom: 0;
        }

        .tape-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .tape-title {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2rem;
        }

        .bar-container {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            border: 1px solid var(--card-border);
        }

        .bar-buffalo {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            border-radius: 4px 0 0 4px;
            transition: width 1s ease-in-out;
        }

        .bar-opponent {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #b91c1c);
            border-radius: 0 4px 4px 0;
            flex-grow: 1;
        }

        /* Key Matchups Cards */
        .matchup-card {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.15rem;
            margin-bottom: 1rem;
        }

        .matchup-card:last-child {
            margin-bottom: 0;
        }

        .matchup-combatants {
            font-weight: 700;
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 0.35rem;
        }

        .matchup-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Injury Report */
        .injury-team-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.35rem;
        }

        .injury-list {
            list-style: none;
        }

        .injury-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 0.35rem 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }

        .status-out { color: var(--accent-red); font-weight: 700; }
        .status-questionable { color: var(--accent-gold); font-weight: 700; }
        .status-doubtful { color: #f97316; font-weight: 700; }
        .status-probable { color: var(--success-green); font-weight: 700; }

        /* Betting Intel */
        .betting-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .bet-card {
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .bet-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .bet-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
        }

        .consensus-bar-wrapper {
            margin-top: 1rem;
        }

        .consensus-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>ONE BUFFALO INTEL</h1>
        <div class="meta-bar">
            <span id="update-status">Matchup Intel & Head-to-Head Preview</span>
            <span>•</span>
            <span>Bills • Sabres • Bandits</span>
        </div>
    </header>

    <!-- 5-TAB NAVIGATION BAR -->
    <nav class="view-switcher">
        <a href="./index.html" class="switch-btn switch-btn-inactive">
            <span>⚡</span> Command Center
        </a>
        <a href="./preview.html" class="switch-btn switch-btn-active">
            <span>⚔️</span> Matchup Intel
        </a>
        <a href="./playoffs.html" class="switch-btn switch-btn-inactive">
            <span>🏆</span> Postseason
        </a>
        <a href="./stats.html" class="switch-btn switch-btn-inactive">
            <span>📊</span> Stats Lab
        </a>
        <a href="./history.html" class="switch-btn switch-btn-inactive">
            <span>📜</span> History & Milestones
        </a>
    </nav>

    <main class="container" id="app">
        <!-- Team Selector Bar -->
        <div class="preview-filter-bar">
            <button class="preview-filter-btn active" onclick="switchPreviewTeam('bills', this)">Buffalo Bills</button>
            <button class="preview-filter-btn" onclick="switchPreviewTeam('sabres', this)">Buffalo Sabres</button>
            <button class="preview-filter-btn" onclick="switchPreviewTeam('bandits', this)">Buffalo Bandits</button>
        </div>

        <div id="preview-content">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Loading matchup intel from data.json...
            </div>
        </div>
    </main>

    <footer>
        <p>One Buffalo Multi-Sport Hub. Hosted on <a href="https://github.com" target="_blank" rel="noopener" style="color: #38bdf8;">GitHub Pages</a> via onebuffalotracker.fyi.</p>
    </footer>

    <script>
        let globalData = null;

        async function loadPreviewData() {
            try {
                const res = await fetch('./data.json?v=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('data.json not loaded');
                globalData = await res.json();
                renderPreview('bills'); // Default to Bills
            } catch (err) {
                console.warn('Preview load fallback:', err);
                document.getElementById('preview-content').innerHTML = `
                    <div style="text-align: center; padding: 4rem; color: #f87171;">
                        Error loading data.json feed. Please verify local server or file path.
                    </div>
                `;
            }
        }

        function switchPreviewTeam(teamKey, btn) {
            document.querySelectorAll('.preview-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPreview(teamKey);
        }

        function renderPreview(teamKey) {
            if (!globalData || !globalData[teamKey]) return;
            const teamObj = globalData[teamKey];
            const game = teamObj.nextGame;
            const container = document.getElementById('preview-content');

            container.innerHTML = `
                <!-- Hero Banner -->
                <div class="hero-banner">
                    <span class="team-badge">${game.sport} Matchup Preview</span>
                    <div class="matchup-teams">
                        <div class="team-block">
                            <div class="team-name" style="color: var(--accent-gold);">${teamObj.team}</div>
                        </div>
                        <div class="vs-tag">vs</div>
                        <div class="team-block">
                            <div class="team-name">${game.opponent}</div>
                        </div>
                    </div>
                    <div class="game-meta">
                        📍 ${game.venue} &nbsp;•&nbsp; 🕒 ${game.gameTime}
                    </div>
                </div>

                <!-- Tale of the Tape -->
                <div class="card">
                    <h2 class="section-title">📊 Tale of the Tape: Offense vs. Defense</h2>
                    <div>
                        ${game.taleOfTheTape.map(tape => `
                            <div class="tape-row">
                                <div class="tape-title">${tape.title}</div>
                                <div class="tape-labels">
                                    <span style="color: #60a5fa;">${tape.bufLabel}</span>
                                    <span style="color: #f87171;">${tape.oppLabel}</span>
                                </div>
                                <div class="bar-container">
                                    <div class="bar-buffalo" style="width: ${tape.bufPct}%;"></div>
                                    <div class="bar-opponent"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Two Column Layout: Key Matchups & Injury Report -->
                <div class="grid-2">
                    <div class="card" style="margin-bottom: 0;">
                        <h2 class="section-title">⚔️ Key Matchups to Watch</h2>
                        <div>
                            ${game.keyMatchups.map(m => `
                                <div class="matchup-card">
                                    <div class="matchup-combatants">${m.combatants}</div>
                                    <div class="matchup-desc">${m.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card" style="margin-bottom: 0;">
                        <h2 class="section-title">🏥 Injury & Inactive Report</h2>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div>
                                <div class="injury-team-title">${teamObj.team}</div>
                                <ul class="injury-list">
                                    ${game.injuries.buffalo.map(i => `
                                        <li class="injury-item">
                                            <span>${i.player} (${i.position})</span>
                                            <span class="status-${i.status.toLowerCase()}">${i.status}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div>
                                <div class="injury-team-title">${game.opponent}</div>
                                <ul class="injury-list">
                                    ${game.injuries.opponent.map(i => `
                                        <li class="injury-item">
                                            <span>${i.player} (${i.position})</span>
                                            <span class="status-${i.status.toLowerCase()}">${i.status}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Betting & Market Intel -->
                <div class="card">
                    <h2 class="section-title">📈 Betting & Market Intel</h2>
                    <div class="betting-grid">
                        <div class="bet-card">
                            <div class="bet-label">Spread</div>
                            <div class="bet-value">${game.betting.spread}</div>
                        </div>
                        <div class="bet-card">
                            <div class="bet-label">Moneyline</div>
                            <div class="bet-value">${game.betting.moneyline}</div>
                        </div>
                        <div class="bet-card">
                            <div class="bet-label">Over / Under</div>
                            <div class="bet-value">${game.betting.overUnder}</div>
                        </div>
                    </div>
                    <div class="consensus-bar-wrapper">
                        <div class="consensus-labels">
                            <span style="color: #60a5fa;">${teamObj.team} Public Pick (${game.betting.buffaloConsensus}%)</span>
                            <span style="color: #f87171;">${game.opponent} Public Pick (${game.betting.opponentConsensus}%)</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar-buffalo" style="width: ${game.betting.buffaloConsensus}%;"></div>
                            <div class="bar-opponent"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', loadPreviewData);
    </script>
</body>
</html>
