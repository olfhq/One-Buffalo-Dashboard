name: Update Buffalo Odds Twice Daily

on:
  schedule:
    # 08:20 UTC (4:20 AM EDT) and 20:20 UTC (4:20 PM EDT)
    - cron: '20 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install cheerio

      - name: Run Scraper
        run: node scripts/scrape.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-update Buffalo playoff probabilities [skip ci]" && git push origin v4)
