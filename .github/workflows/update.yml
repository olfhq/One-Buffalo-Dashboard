name: Update Buffalo Odds Post-Game Windows

on:
  schedule:
    # Automated safety net: runs every 6 hours at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: buffalo-odds-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Scraper
        run: node scripts/scrape.js

      - name: Run Quality & Integrity Tests
        run: npm test

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html bills.html sabres.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Buffalo playoff probabilities [skip ci]"
            git pull --rebase --autostash origin v4
            git push origin v4
          fi
