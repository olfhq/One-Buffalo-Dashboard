name: Update Buffalo Odds Post-Game Windows

on:
  schedule:
    # Automated safety net: runs every 6 hours at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Site-wide canned theme'
        required: false
        default: 'regular'
        type: choice
        options:
          - regular
          - goathead
          - snow-game
          - heritage
          - gameday
          - halloween
          - christmas
          - new-years
      themeUntil:
        description: 'Auto-revert ISO expiration (e.g. 2026-11-01T23:59:59Z, or empty for indefinite)'
        required: false
        default: ''
        type: string

concurrency:
  group: buffalo-odds-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: v4
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Theme Selection
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.theme != '' }}"
        run: |
          node -e '
            const fs = require("fs");
            const p = "./data.json";
            const data = JSON.parse(fs.readFileSync(p, "utf8"));
            data.theme = "${{ github.event.inputs.theme }}";
            data.themeUntil = "${{ github.event.inputs.themeUntil }}".trim() || null;
            fs.writeFileSync(p, JSON.stringify(data, null, 2), "utf8");
            console.log("Central theme set to: " + data.theme + " (until: " + data.themeUntil + ")");
          '

      - name: Run Scraper
        run: node scripts/scrape.js

      - name: Run Quality & Integrity Tests
        run: npm test

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html bills.html sabres.html
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Buffalo playoff probabilities [skip ci]"
            git pull --rebase --autostash origin v4
            git push origin v4
          fi
